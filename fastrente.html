<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg0: #080b11; --bg1: #0e1218; --bg2: #141820; --bg3: #1c2230; --bg4: #222a3a;
    --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.11); --border3: rgba(255,255,255,0.18);
    --text1: #e6eaf4; --text2: #7f8799; --text3: #434b5e;
    --green: #00e5a0; --green-bg: rgba(0,229,160,0.08); --green-border: rgba(0,229,160,0.22);
    --red: #ff4060; --red-bg: rgba(255,64,96,0.08); --red-border: rgba(255,64,96,0.18);
    --blue: #4d8fff; --blue-bg: rgba(77,143,255,0.08); --blue-border: rgba(77,143,255,0.22);
    --amber: #ffb020; --amber-bg: rgba(255,176,32,0.08); --amber-border: rgba(255,176,32,0.22);
    --accent: #4d8fff;
    /* Tenor identity (3 / 5 / 10 år). Validated with the dataviz palette checker on #080b11,
       #0e1218 and #141820, all pairs: worst CVD ΔE 9.4, normal vision 20.9, ≥3:1 contrast.
       The previous blue/purple pair failed (protan ΔE 1.7). */
    --t3: #3987e5; --t5: #d95926; --t10: #199e70;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg0); color: var(--text1); font-family: 'Syne', sans-serif; min-height: 100vh; overflow-x: hidden; }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  /* ── TOPBAR ── */
  .topbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; height: 56px; background: rgba(8,11,17,0.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .logo-wrap { display: flex; align-items: baseline; gap: 10px; }
  .logo { font-size: 15px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text1); text-decoration: none; }
  .logo-dot { color: var(--accent); }
  .logo-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); letter-spacing: 0.08em; }
  .topbar-right { display: flex; align-items: center; gap: 16px; min-width: 0; }

  /* ── HERO ── */
  .hero { padding: 48px 36px 36px; border-bottom: 1px solid var(--border); position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 50% 80% at 80% 50%, rgba(0,229,160,0.04) 0%, transparent 70%), radial-gradient(ellipse 30% 60% at 5% 20%, rgba(77,143,255,0.04) 0%, transparent 70%); pointer-events: none; }
  .hero-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--green); text-transform: uppercase; margin-bottom: 14px; }
  .hero-title { font-size: clamp(28px, 3.5vw, 46px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; color: var(--text1); margin-bottom: 12px; }
  .hero-title span { color: var(--green); }
  .hero-desc { font-size: 13px; line-height: 1.75; color: var(--text2); max-width: 680px; }

  /* ── LAYOUT ── */
  .main { padding: 28px 36px; display: flex; flex-direction: column; gap: 20px; max-width: 1200px; }
  .card { background: var(--bg1); border: 1px solid var(--border); border-radius: 6px; padding: 22px 24px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .card-title { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text2); }
  .card-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); }
  .note { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); line-height: 1.75; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .section-divider { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text3); padding: 4px 0 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }

  /* ── WINDOW BANNER ── */
  .window-banner { border-radius: 6px; padding: 16px 22px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .window-banner.open { background: var(--green-bg); border: 1px solid var(--green-border); }
  .window-banner.soon { background: var(--amber-bg); border: 1px solid var(--amber-border); }
  .window-banner.closed { background: var(--bg1); border: 1px solid var(--border); }
  .banner-left { display: flex; align-items: center; gap: 16px; }
  .banner-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; flex-shrink: 0; }
  .banner-icon.open { background: rgba(0,229,160,0.12); color: var(--green); }
  .banner-icon.soon { background: rgba(255,176,32,0.12); color: var(--amber); }
  .banner-icon.closed { background: var(--bg3); color: var(--text2); }
  .banner-title { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .banner-title.open { color: var(--green); } .banner-title.soon { color: var(--amber); } .banner-title.closed { color: var(--text2); }
  .banner-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); }

  /* ── DECISION PANEL ── */
  .decision { background: linear-gradient(180deg, rgba(57,135,229,0.07), rgba(14,18,24,0) 45%), var(--bg1); border: 1px solid var(--border2); border-radius: 8px; padding: 26px 28px; }
  .dec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .dec-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text2); }
  .dec-when { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); text-align: right; line-height: 1.7; }
  .verdict { display: flex; align-items: center; gap: 14px; margin: 4px 0 12px; }
  .verdict-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800; flex-shrink: 0; }
  .verdict-icon.go { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green); }
  .verdict-icon.lean { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber); }
  .verdict-icon.wait { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red); }
  .verdict-title { font-size: clamp(22px, 2.6vw, 32px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .chip { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; vertical-align: middle; }
  .chip.go { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .chip.lean { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .chip.wait { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .chip.info { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); }
  .dec-summary { font-size: 13px; line-height: 1.8; color: var(--text2); max-width: 900px; margin-bottom: 20px; }
  .dec-summary strong { color: var(--text1); font-weight: 600; }
  .tenor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .tenor-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px 14px; }
  .tenor-card.best { border-color: var(--border3); box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset; }
  .tc-key { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .tc-name { display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text2); }
  .sw { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; display: inline-block; }
  .sw.line { height: 2px; width: 14px; border-radius: 1px; }

  .sw.dot { width: 8px; height: 8px; border-radius: 50%; }
  .tc-rates { display: grid; grid-template-columns: 1fr 16px 1fr; align-items: end; gap: 6px; margin-bottom: 12px; }
  .tc-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text3); margin-bottom: 4px; }
  .tc-val { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--text1); line-height: 1; white-space: nowrap; }
  .tc-val.dim { color: var(--text2); }
  .tc-sub { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text3); margin-top: 5px; line-height: 1.5; }
  .tc-arrow { font-family: 'IBM Plex Mono', monospace; color: var(--text3); text-align: center; padding-bottom: 16px; }
  .tc-rows { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .tc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); }
  .tc-row b { font-weight: 500; color: var(--text1); font-size: 11px; text-align: right; }
  .tc-row b.pos { color: var(--green); } .tc-row b.neg { color: var(--red); }
  .meter { height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-top: -2px; }
  .meter > span { display: block; height: 100%; border-radius: 2px; }
  .dec-inputs { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin: 16px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text2); }
  .dec-inputs label { display: flex; align-items: center; gap: 8px; }
  .dec-inputs input { width: 110px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 4px; padding: 6px 10px; color: var(--text1); outline: none; }
  .dec-inputs input:focus { border-color: var(--blue-border); }
  .dec-inputs .hint { color: var(--text3); }
  .dec-cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 28px; margin-top: 24px; }
  .why { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .why li { font-size: 12px; line-height: 1.7; color: var(--text2); padding-left: 18px; position: relative; }
  .why li::before { content: ''; position: absolute; left: 0; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
  .why li.up::before { background: var(--green); } .why li.down::before { background: var(--red); } .why li.risk::before { background: var(--amber); }
  .why li strong { color: var(--text1); font-weight: 600; }
  .plan-row { display: grid; grid-template-columns: 78px 1fr; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .plan-row:last-child { border-bottom: none; }
  .plan-date { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text2); padding-top: 2px; }
  .plan-row.done .plan-date { color: var(--text3); text-decoration: line-through; }
  .plan-row.next .plan-date { color: var(--text1); }
  .plan-text { font-size: 12px; color: var(--text2); line-height: 1.6; }
  .plan-text strong { color: var(--text1); font-weight: 600; }
  .plan-tag { white-space: nowrap; font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); border: 1px solid var(--amber-border); border-radius: 3px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
  .already { margin-top: 24px; padding: 16px 18px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; }
  .already-title { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
  .already p { font-size: 12px; line-height: 1.75; color: var(--text2); margin-bottom: 10px; }
  .already p strong { color: var(--text1); font-weight: 600; }

  /* ── CONTROLS / CHARTS ── */
  .seg { display: inline-flex; border: 1px solid var(--border2); border-radius: 4px; overflow: hidden; }
  .seg button { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; padding: 6px 12px; background: transparent; color: var(--text3); border: none; cursor: pointer; display: flex; gap: 7px; align-items: center; }
  .seg button + button { border-left: 1px solid var(--border2); }
  .seg button.active { background: var(--bg3); color: var(--text1); }
  .seg button:focus-visible { outline: 1px solid var(--blue); outline-offset: -1px; }
  .chart-outer { position: relative; width: 100%; height: 330px; }
  .chart-outer.short { height: 300px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  .legend span { display: flex; align-items: center; gap: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text2); }
  .stat-strip { display: flex; gap: 26px; flex-wrap: wrap; margin: 0 0 16px; }
  .stat .k { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; }
  .stat .v { font-size: 17px; font-weight: 700; color: var(--text1); margin-top: 3px; }

  /* ── TABLES ── */
  .tbl-wrap { overflow-x: auto; }
  .wed-table { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
  .wed-table th { font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); font-weight: 400; padding: 0 12px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  .wed-table th:first-child, .wed-table td:first-child { text-align: left; }
  .wed-table td { padding: 9px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text2); border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  .wed-table tr:last-child td { border-bottom: none; }
  .wed-table tr:hover td { background: var(--bg2); }
  .wed-table td.pos { color: var(--green); } .wed-table td.neg { color: var(--red); } .wed-table td.ink { color: var(--text1); }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 8px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .badge.yes { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .badge.no { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }
  .badge.miss { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .badge.flag { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .more-btn { margin-top: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text2); background: transparent; border: 1px solid var(--border2); border-radius: 3px; padding: 5px 10px; cursor: pointer; }

  /* ── OBSERVATION TRACKER ── */
  .forecast-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .forecast-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px; }
  .fc-label { display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; }
  .fc-rate { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: var(--text1); line-height: 1; margin-bottom: 6px; }
  .fc-sub { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); line-height: 1.6; }
  .fc-wednesdays { margin-top: 12px; display: flex; gap: 5px; flex-wrap: wrap; }
  .fc-wed { min-width: 34px; height: 20px; padding: 0 5px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; }
  .fc-wed.observed { background: var(--bg4); color: var(--text1); border: 1px solid var(--border3); }
  .fc-wed.pending { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }

  /* ── NORGES BANK ── */
  .nb-big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .nb-rate { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .nb-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .nb-row:last-child { border-bottom: none; }
  .nb-row .r { color: var(--text3); font-size: 10px; text-align: right; }
  .quote { border-left: 2px solid var(--border3); padding: 4px 0 4px 14px; font-size: 12px; line-height: 1.75; color: var(--text2); margin: 4px 0 10px; }

  /* ── DATA HEALTH / MISC ── */
  .health { display: flex; gap: 18px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); }
  .health span::before { content: '●'; margin-right: 6px; }
  .health .ok::before { color: var(--green); } .health .warn::before { color: var(--amber); } .health .bad::before { color: var(--red); }
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; }
  .spinner { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border2); border-top-color: var(--green); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text3); letter-spacing: 0.1em; }
  .error-box { background: var(--red-bg); border: 1px solid var(--red-border); border-radius: 6px; padding: 14px 18px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text2); line-height: 1.7; }
  .footer { margin-top: 40px; padding: 24px 36px; border-top: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .footer-text { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text3); line-height: 1.7; }
  .fade-in { animation: fadeIn 0.5s ease forwards; }

  @media (max-width: 960px) {

    .decision { padding: 20px 16px; }

    .dec-when, .banner-right { text-align: left; }

    .logo-sub { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } html { scroll-behavior: auto; } }
</style>

<script>
'use strict';
// ── CONFIG ───────────────────────────────────────────────────────────────────
// Three independent feeds, loaded in parallel; any one failing degrades its own section only.
//  · Finansportalen top-5 fixed rates, read every Wednesday — the observations Lånekassen
//    averages. Google Sheet maintained outside these repos (gviz CSV). Its swap-curve tab
//    stopped on 2026-08-19 and its floating-rate column in June 2026; neither is used any more.
//  · Official Lånekassen rates → api.lanekassen_rates (ENEXT World Intel source "lanekassen").
//  · Norway government yields 3/5/10Y + Norges Bank policy rate → api.world_history (ENEXT).
const SHEET_ID = '1PIZWStO5waUY7He56kiqK683_SpyM3UOiNo5pIZaT7Y';
const GID_RENTER = '70515895';
const API = 'https://api.slensvik.com';
const TENORS = [
  { k: 3,  label: '3 år',  key: 'fast_3',  ngb: 'yc.no.3y',  fp: 'fp3',  color: '#3987e5' },
  { k: 5,  label: '5 år',  key: 'fast_5',  ngb: 'yc.no.5y',  fp: 'fp5',  color: '#d95926' },
  { k: 10, label: '10 år', key: 'fast_10', ngb: 'yc.no.10y', fp: 'fp10', color: '#199e70' },
];
// Banks' fixed rates follow government yields with a lag; 14 days minimised the spread's
// variance on the 2026 Finansportalen readings (sd 0.059 pp for 3 år vs 0.081 at no lag).

async function fetchSheet(gid) {

function parseCSV(raw) {

    const out = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { out.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }

  }

}

// ── MODEL: series, cycle, rates ─────────────────────────────────────────────
function makeSeries(dates, vals) {
  const ds = dates.map(parseISO), idx = new Map(dates.map((s, i) => [s, i]));
  let last = null, lastVal = null;
  for (let i = ds.length - 1; i >= 0; i--) if (vals[i] != null) { last = ds[i]; lastVal = vals[i]; break; }
  return {
    dates: ds, vals, last, lastVal,
    // value on d or the nearest earlier business day (≤ 10 calendar days back)
    at(d) {
      for (let k = 0; k <= 10; k++) { const i = idx.get(iso(addDays(d, -k))); if (i !== undefined && vals[i] != null) return vals[i]; }
      return null;
    },
    // as at(), but dates beyond the last observation take the latest value (random-walk projection)
    atOrLatest(d) { return last && d > last ? lastVal : this.at(d); },
  };
}
function lkModel(rows) {
  const sorted = rows.slice().sort((a, b) => a.valid_from.localeCompare(b.valid_from));
  const by = new Map(sorted.map(r => [r.valid_from, r]));
  return {
    rows: sorted,
    newest: sorted.length ? parseISO(sorted[sorted.length - 1].valid_from) : null,
    fixed(d, t) { const r = by.get(iso(d)); return r && r[t.key] != null ? +r[t.key] : null; },
    floatOn(d) {
      let hit = null;
      for (const r of sorted) if (parseISO(r.valid_from) <= d && r.flytende != null) hit = { rate: +r.flytende, from: parseISO(r.valid_from) };
      return hit;
    },
  };
}
// The window this page is about: the next 10.–17. window of an even month that hasn't closed.
function cycleFor(today) {
  const y = today.getFullYear();
  let m = today.getMonth();                                  // 0-based; even calendar months have odd indices
  const evenCal = mm => (mm + 1) % 2 === 0;
  if (!evenCal(m)) m += 1;
  else if (today.getDate() > 17) m += 2;
  const winOpen = new Date(y, m, 10), winClose = new Date(y, m, 17);
  return {
    winOpen, winClose,
    src: new Date(y, m - 1, 1),            // odd month whose Wednesdays set this window's offers
    eff: new Date(y, m + 1, 1),            // a lock starts here; also the next window's observation month
    nextOpen: new Date(y, m + 2, 10), nextClose: new Date(y, m + 2, 17),
    breakEff: new Date(y, m + 3, 1),       // a break in the next window takes effect here
    prevOpen: new Date(y, m - 2, 10),      // the previous window …
    prevEff: new Date(y, m - 1, 1),        // … whose offers applied from here
    state: today < winOpen ? 'soon' : today <= winClose ? 'open' : 'closed',
    daysToOpen: Math.round((winOpen - today) / 864e5),
    daysToClose: Math.round((winClose - today) / 864e5),
  };
}
function spreadStats(readings, s, key) {
  if (!s) return null;

    if (r[key] == null) continue;
    const y = s.at(addDays(r.d, -LAG_DAYS));
    if (y != null) xs.push({ d: r.d, v: r[key] - y });
  }
  if (xs.length < 4) return null;
  const v = xs.map(x => x.v);

}
function projectFP(w, s, sp) {
  if (!s || !sp) return null;

// Offers for the window: official once Lånekassen publishes (the 10th); before that the average of
// the source month's Finansportalen Wednesdays (missing/future ones projected from yields).
function windowRates(cyc, lk, rd, ngb, spreads) {
  const weds = wednesdays(cyc.src), out = {};
  for (const t of TENORS) {
    const official = lk ? lk.fixed(cyc.eff, t) : null;
    const obs = weds.map(w => { const r = rd.byIso.get(iso(w)); return w <= TODAY && r && r[t.fp] != null ? r[t.fp] : null; });
    const k = obs.filter(v => v != null).length;
    const proj = weds.map((w, i) => obs[i] != null ? obs[i] : projectFP(w, ngb[t.ngb], spreads[t.k]));
    const computed = proj.every(v => v != null) ? avg(proj) : null;
    out[t.k] = {
      rate: official != null ? official : computed, official, computed, k, n: weds.length,
      kind: official != null ? 'official' : computed == null ? 'missing' : k === weds.length ? 'computed' : 'provisional',

// How far yields have moved since the observations behind the offers (bp) — the predictor.
function signalFor(cyc, s) {
  if (!s) return null;
  const lagged = wednesdays(cyc.src).map(w => s.atOrLatest(addDays(w, -LAG_DAYS)));
  if (lagged.some(v => v == null)) return null;
  const base = avg(lagged);
  return { bp: (s.lastVal - base) * 100, now: s.lastVal, base, asOf: s.last };

// ── MODEL: Lånekassen's break settlement ───────────────────────────────────
// Lånekassen compares your rate with new agreements for the same remaining term (interpolated
// between 3, 5 and 10 år) and settles the PV of the difference on your fixed repayment plan.
// Annuity plan at the locked rate; PV at the reference rate. elapsed = months held at the break.
function breakGain(balance, years, lockRate, refRate, bindYears, elapsed = 2) {
  const n = bindYears * 12 - elapsed;
  const L = Math.max(n, Math.round(years * 12) - elapsed);
  const rl = lockRate / 1200, rr = refRate / 1200;
  const pay = rl > 0 ? balance * rl / (1 - Math.pow(1 + rl, -L)) : balance / L;
  let B = balance, pv = 0;
  for (let k = 1; k <= n; k++) { pv += B * (rr - rl) / Math.pow(1 + rr, k); B = B * (1 + rl) - pay; }
  return pv;
}
function refRate(yearsLeft, r3, r5, r10) {
  if (yearsLeft <= 3) return r3;
  if (yearsLeft <= 5) return r3 + (yearsLeft - 3) / 2 * (r5 - r3);
  if (yearsLeft <= 10) return r5 + (yearsLeft - 5) / 5 * (r10 - r5);
  return r10;
}

// ── MODEL: calibration on official history ─────────────────────────────────
// Every past cycle: lock at window M (offer applies from eff), break at M+2. Predictor = government
// yield on the 9th of M minus the yield behind the source month's Wednesdays (lag 14 d);
// outcome = the M+2 offer minus the M offer. Through-origin fit: no drift is assumed.
function calibrate(lk, ngb, years) {
  const out = {};
  for (const t of TENORS) {
    const s = ngb[t.ngb], rows = [];
    if (!s || !lk) { out[t.k] = null; continue; }
    for (const r of lk.rows) {
      const eff = parseISO(r.valid_from);
      const a = lk.fixed(eff, t), b = lk.fixed(addMonths(eff, 2), t);
      if (a == null || b == null) continue;
      const src = addMonths(eff, -2), sigDay = new Date(eff.getFullYear(), eff.getMonth() - 1, 9);
      const lagged = wednesdays(src).map(w => s.at(addDays(w, -LAG_DAYS)));
      const now = s.at(sigDay);
      if (now == null || lagged.some(v => v == null)) continue;
      const fl = lk.floatOn(eff);
      const perBp = breakGain(1, years, a, a + 0.01, t.k);
      const carry = fl ? (a - fl.rate) / 100 * 2 / 12 : 0;
      const be = perBp > 0 ? carry / perBp : 0;
      const outcome = (b - a) * 100;
      rows.push({ eff, lockOpen: new Date(eff.getFullYear(), eff.getMonth() - 1, 10), breakOpen: new Date(eff.getFullYear(), eff.getMonth() + 1, 10),
                  lock: a, next: b, signal: (now - avg(lagged)) * 100, outcome, be, hit: outcome > be });
    }
    if (rows.length < 6) { out[t.k] = null; continue; }
    const sxy = sum(rows.map(r => r.signal * r.outcome)), sxx = sum(rows.map(r => r.signal * r.signal));
    const beta = sxx ? sxy / sxx : 0;
    const resid = rows.map(r => r.outcome - beta * r.signal);
    out[t.k] = { rows, beta, s: Math.sqrt(sum(resid.map(e => e * e)) / (rows.length - 1)), corr: pearson(rows.map(r => r.signal), rows.map(r => r.outcome)) };
  }
  return out;
}

// ── MODEL: the decision ─────────────────────────────────────────────────────
const Z80 = 1.2816;
function decide(ctx, inputs) {
  const { cyc, rates, sig, cal, lk } = ctx;
  const fl = lk ? lk.floatOn(cyc.eff) : null;
  const d = {}, newR = {};
  for (const t of TENORS) {
    const f = cal[t.k], s = sig[t.k], lock = rates[t.k].rate;
    d[t.k] = f && s ? f.beta * s.bp : null;
    newR[t.k] = lock != null && d[t.k] != null ? lock + d[t.k] / 100 : null;
  }
  const all = TENORS.every(t => newR[t.k] != null);
  const res = {};
  for (const t of TENORS) {
    const lock = rates[t.k].rate, f = cal[t.k];
    if (!all || !fl || !f) { res[t.k] = null; continue; }
    const yl = t.k - 2 / 12;
    const gain = shift => breakGain(inputs.balance, inputs.years, lock, refRate(yl, newR[3] + shift, newR[5] + shift, newR[10] + shift), t.k);
    const carry = inputs.balance * (lock - fl.rate) / 100 * 2 / 12;
    const perBp = breakGain(inputs.balance, inputs.years, lock, lock + 0.01, t.k);
    const be = perBp > 0 ? carry / perBp : 0;
    const half = Z80 * f.s / 100;
    res[t.k] = {
      t, lock, d: d[t.k], newRate: newR[t.k], lo: newR[t.k] - half, hi: newR[t.k] + half,
      p: normCdf((d[t.k] - be) / f.s), be, carry, perBp,
      net: gain(0) - carry, netLo: gain(-half) - carry, netHi: gain(half) - carry,
    };
  }
  const list = TENORS.map(t => res[t.k]).filter(Boolean);
  const best = list.length ? list.slice().sort((a, b) => (b.p - a.p) || (b.net - a.net))[0] : null;
  const bestPc = best ? Math.round(best.p * 100) : 0;
  const level = !best ? 'none' : bestPc >= 75 ? 'go' : bestPc >= 55 ? 'lean' : 'wait';
  const maxNet = list.length ? list.slice().sort((a, b) => b.net - a.net)[0] : null;
  // Locked in the previous window? Break now (effective cyc.eff), or hold to the next window?
  const prev = [];
  const flNext = lk ? lk.floatOn(cyc.eff) : null;
  for (const t of TENORS) {
    const pr = lk ? lk.fixed(cyc.prevEff, t) : null, cur = rates[t.k].rate;
    if (pr == null || cur == null || !all || !flNext) continue;
    const yl = t.k - 2 / 12, yl2 = t.k - 4 / 12;
    const nowGain = breakGain(inputs.balance, inputs.years, pr, refRate(yl, rates[3].rate, rates[5].rate, rates[10].rate), t.k, 2);
    const waitGain = breakGain(inputs.balance, inputs.years, pr, refRate(yl2, newR[3], newR[5], newR[10]), t.k, 4);
    const waitCarry = inputs.balance * (pr - flNext.rate) / 100 * 2 / 12;   // fixed instead of floating while you wait
    prev.push({ t, prevRate: pr, itm: (cur - pr) * 100, nowGain, waitGain, waitCarry, waitAdv: waitGain - waitCarry - nowGain });
  }
  return { res, best, maxNet, level, fl, prev };
}

// ── MODEL: Norges Bank ──────────────────────────────────────────────────────
function nbModel(pol, cyc) {
  if (!pol || !pol.last) return null;
  const changes = [];
  for (let i = 1; i < pol.vals.length; i++) {
    if (pol.vals[i] != null && pol.vals[i - 1] != null && pol.vals[i] !== pol.vals[i - 1]) changes.push({ eff: pol.dates[i], from: pol.vals[i - 1], to: pol.vals[i] });
  }
  const meetings = NB_MEETINGS.map(s => {
    const d = parseISO(s);
    const covered = addDays(d, 1) <= pol.last;
    const before = covered ? pol.at(d) : null, after = covered ? pol.at(addDays(d, 4)) : null;
    const flags = [];
    if (d >= cyc.winOpen && d <= cyc.winClose) flags.push('i vinduet');
    if (d.getFullYear() === cyc.eff.getFullYear() && d.getMonth() === cyc.eff.getMonth()) flags.push('i observasjonsmåneden');
    if (d >= cyc.nextOpen && d <= cyc.nextClose) flags.push('siste dag å bryte');
    return { d, past: d < TODAY, covered, before, after, delta: before != null && after != null ? after - before : null, flags };
  });
  return { rate: pol.lastVal, asOf: pol.last, changes, last: changes[changes.length - 1] || null, meetings };
}

// ── RENDER: decision panel ──────────────────────────────────────────────────
function decisionPanel(ctx) {
  const { cyc, rates, sig, nb, spreads, cal, errors } = ctx;
  const dec = ctx.dec;

  const prov = rates[3].kind === 'provisional';

      ? `Satsene for ${winName}-vinduet settes av <strong>${srcName}s onsdagsobservasjoner</strong> — ${rates[3].k} av ${rates[3].n} er tatt, resten er anslått (3 år: ${pct(rates[3].rate)} foreløpig). `
      : `Satsene du kan binde ble satt av <strong>${srcName}s onsdagsobservasjoner</strong> (3 år: ${pct(rates[3].rate)}). `)
    + (Math.abs(sigHi) > 3 || Math.abs(sigLo) > 3

    + `altså <strong>${bp(t3.d)}</strong> mot det du kan binde nå. Tryggest: <strong>${b.t.label}</strong>, med ${Math.round(b.p * 100)} % sannsynlighet for gevinst etter kostnaden ved å ha fastrente i to måneder.`
    + (dec.maxNet && dec.maxNet.t.k !== b.t.k ? ` Størst forventet gevinst: <strong>${dec.maxNet.t.label}</strong> (${kr(dec.maxNet.net)} på saldoen din), men med større spenn begge veier.` : '');
  return `<section class="decision" id="decision">${head}
    <div class="verdict"><div class="verdict-icon ${dec.level}">${lvl[0]}</div>
      <div><div class="verdict-title">${lvl[1]}</div><div style="margin-top:6px"><span class="chip ${dec.level}">${lvl[2]}</span> <span class="chip info">P(gevinst) ${Math.round(b.p * 100)} % · ${b.t.label}</span></div></div></div>

    <div class="tenor-grid" id="tenorGrid">${tenorCards(ctx)}</div>
    <div class="dec-inputs">
      <label>Lånesaldo <input type="number" id="inBalance" min="1000" step="10000" value="${ctx.inputs.balance}"> kr</label>
      <label>Gjenværende nedbetalingstid <input type="number" id="inYears" min="3" max="30" step="1" value="${ctx.inputs.years}" style="width:70px"> år</label>
      <span class="hint">Beløpene skalerer med saldoen; nedbetalingstiden styrer hvor raskt saldoen (og gevinsten) krymper.</span>

function whyBullets(ctx) {

    const ann = addDays(nb.last.eff, -1), after = weds.filter(w => w > ann).length;
    const up = nb.last.to > nb.last.from;
    out.push(`<li class="${up ? 'up' : 'down'}"><strong>Norges Bank ${up ? 'hevet' : 'kuttet'} styringsrenten ${nf(nb.last.from, 2)} → ${pct(nb.last.to, 2)}</strong> (${fmtDay(ann)}). `
      + `Bare ${after} av ${weds.length} onsdager i ${srcName} kom etter beslutningen — og bankene justerer fastrentene med et par ukers forsinkelse.</li>`);
  }

    const up = s3.bp > 0;
    out.push(`<li class="${up ? 'up' : 'down'}"><strong>Statsrentene 3 / 5 / 10 år er ${nf(s3.now, 2)} / ${nf(s5.now, 2)} / ${pct(s10.now, 2)}</strong> (${fmtDay(s3.asOf)}): `
      + `${bp(s3.bp)} / ${bp(s5.bp)} / ${bp(s10.bp)} mot nivået ${srcName}-observasjonene bygger på. Det er dette markedet bankene skal prise inn før neste observasjonsmåned.</li>`);
  }
  const sp = spreads[3];
  if (sp && sp.last && sp.sd && sp.last.v < sp.mean - 0.5 * sp.sd) {
    out.push(`<li class="up"><strong>Bankenes påslag over statsrenten er ${pp(sp.last.v)}</strong> (3 år, ${fmtDay(sp.last.d)}) mot normalt ${pp(sp.mean)} — fastrentene har ikke tatt igjen markedet ennå.</li>`);
  } else if (sp && sp.last && sp.sd && sp.last.v > sp.mean + 0.5 * sp.sd) {
    out.push(`<li class="down"><strong>Bankenes påslag over statsrenten er ${pp(sp.last.v)}</strong> (3 år) mot normalt ${pp(sp.mean)} — fastrentene ligger høyt og kan sige ned.</li>`);
  }
  if (dec.fl && dec.best) {
    const x3 = dec.res[3];
    const oA = addMonths(dec.fl.from, -4), oB = addMonths(dec.fl.from, -3), oBend = addMonths(dec.fl.from, -2);
    const before = nb && nb.last && nb.last.eff >= oBend ? `, før renteendringen ${fmtDay(addDays(nb.last.eff, -1))}` : '';
    out.push(`<li><strong>Flytende rente er ${pct(dec.fl.rate)}</strong> fra ${fmtDay(dec.fl.from)} — satt av observasjonene i ${MONTHS[oA.getMonth()]} og ${MONTHS[oB.getMonth()]}${before} (flytende henger to til fire måneder etter markedet). `
      + `Fastrente på 3 år i stedet for flytende i to måneder koster ${kr(x3.carry)} på saldoen din, så ${MONTHS[cyc.nextOpen.getMonth()]}-satsen må opp minst ${bp(x3.be, 1)} før et brudd lønner seg.</li>`);
  }
  const f = cal[3];
  if (f && s3) {
    const thr = s3.bp >= 0 ? Math.min(15, Math.max(5, Math.floor(s3.bp / 5) * 5)) : -5;
    const same = f.rows.filter(r => thr > 0 ? r.signal >= thr : r.signal <= thr);
    const hits = same.filter(r => r.hit).length;
    out.push(`<li class="${hits / Math.max(1, same.length) >= 0.7 ? 'up' : 'risk'}"><strong>Historikk (${f.rows.length} sykluser siden ${f.rows[0].lockOpen.getFullYear()}):</strong> når signalet var ${thr > 0 ? 'minst ' + bp(thr) : 'negativt'}, `
      + `ble neste sats høy nok til gevinst <strong>${hits} av ${same.length} ganger</strong> (snitt ${bp(avg(same.map(r => r.outcome)))}). Sammenhengen (korrelasjon ${nf(f.corr, 2)}) er tydelig, men ikke garantert.</li>`);
  }
  if (dec.best) {
    const nbObs = nb ? nb.meetings.filter(m => !m.past && m.flags.includes('i observasjonsmåneden')) : [];
    out.push(`<li class="risk"><strong>Risiko:</strong> faller rentene igjen før ${MONTHS[cyc.eff.getMonth()]}-observasjonene${nbObs.length ? ' (Norges Bank-møte ' + nbObs.map(m => fmtDay(m.d)).join(' og ') + ')' : ''}, kan ${MONTHS[cyc.nextOpen.getMonth()]}-satsen havne under det du bandt — `
      + `da sitter du med en fastrente over markedet (bryter du, blir det rentetap). Nedre 80 %-utfall for ${dec.best.t.label}: ${kr(dec.best.netLo)}.</li>`);

}

function wedTable(title, meta, weds, rd) {
  const rows = weds.map(w => { const r = rd.byIso.get(iso(w)); return { w, r: w <= TODAY ? r : null }; });
  const cell = v => v != null ? pct(v) : '<span style="color:var(--text3)">—</span>';
  return `<div class="card"><div class="card-header"><span class="card-title">${title}</span><span class="card-meta">${meta}</span></div>
    <div class="tbl-wrap"><table class="wed-table"><thead><tr><th>Onsdag</th>${TENORS.map(t => `<th>${t.label}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(({ w, r }) => `<tr><td class="ink">${fmtDayY(w)}</td>${TENORS.map(t => `<td>${cell(r ? r[t.fp] : null)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;
}
function healthStrip(ctx) {
  const { lk, rd, ngb, pol, cyc } = ctx, items = [];
  const age = d => Math.round((TODAY - d) / 864e5);
  if (lk) {
    const off = TENORS.every(t => lk.fixed(cyc.eff, t) != null);
    items.push(`<span class="ok">Lånekassen: flytende t.o.m. ${fmtMonY(lk.newest)} · ${MONTHS[cyc.winOpen.getMonth()]}-satsene ${off ? 'publisert' : 'kommer ' + fmtDay(cyc.winOpen)}</span>`);
  } else items.push('<span class="bad">Lånekassen-satser mangler</span>');
  const lr = rd.readings.length ? rd.readings[rd.readings.length - 1].d : null;
  items.push(lr ? `<span class="${age(lr) > 16 ? 'bad' : age(lr) > 9 ? 'warn' : 'ok'}">Finansportalen: siste onsdag ${fmtDay(lr)}</span>` : '<span class="bad">Finansportalen-data mangler</span>');
  const y = ngb['yc.no.3y'];
  items.push(y ? `<span class="${age(y.last) > 7 ? 'warn' : 'ok'}">Statsrenter: ${fmtDay(y.last)}</span>` : '<span class="bad">Statsrenter mangler</span>');
  items.push(pol ? `<span class="${age(pol.last) > 7 ? 'warn' : 'ok'}">Styringsrente: ${fmtDay(pol.last)}</span>` : '<span class="bad">Styringsrente mangler</span>');
  return `<div class="card" style="padding:14px 20px"><div class="health">${items.join('')}</div></div>`;
}

// ── CHARTS ──────────────────────────────────────────────────────────────────
const SURFACE = '#0e1218', GRID = 'rgba(255,255,255,0.05)', TICK = '#7f8799', INK = '#e6eaf4', NEUTRAL = '#7f8799';
const charts = {};
// Text on a canvas: kept inside the plot area, on a surface-coloured backing so lines never cross it.
function tag(g, a, text, x, yBase, color, size = 9) {
  g.font = `${size}px 'IBM Plex Mono', monospace`;
  const w = g.measureText(text).width;
  const lx = Math.max(a.left + 2, Math.min(x, a.right - w - 2));
  g.fillStyle = 'rgba(14,18,24,0.85)'; g.fillRect(lx - 3, yBase - size, w + 6, size + 4);
  g.fillStyle = color; g.fillText(text, lx, yBase);
}
const annotate = {
  id: 'annotate',
  beforeDatasetsDraw(chart, args, o) {
    const { ctx: g, chartArea: a, scales: { x } } = chart;
    for (const b of (o.bands || [])) {
      const x0 = x.getPixelForValue(b.from), x1 = x.getPixelForValue(b.to);
      g.save(); g.fillStyle = 'rgba(255,255,255,0.04)'; g.fillRect(x0, a.top, Math.max(1, x1 - x0), a.bottom - a.top); g.restore();
    }
  },
  afterDatasetsDraw(chart, args, o) {
    const { ctx: g, chartArea: a, scales: { x, y } } = chart;
    g.save();
    for (const b of (o.bands || [])) tag(g, a, b.label, x.getPixelForValue(b.from) + 6, a.top + 12, TICK);
    for (const v of (o.vlines || [])) {
      const px = x.getPixelForValue(v.at);
      if (px < a.left - 1 || px > a.right + 1) continue;
      g.strokeStyle = v.color || NEUTRAL; g.lineWidth = 1; if (v.dash) g.setLineDash(v.dash);
      g.beginPath(); g.moveTo(px, a.top); g.lineTo(px, a.bottom); g.stroke(); g.setLineDash([]);
      g.font = "9px 'IBM Plex Mono', monospace";
      const w = g.measureText(v.label).width;
      tag(g, a, v.label, px + 5 + w > a.right ? px - 5 - w : px + 5, a.top + (v.row || 0) * 13 + 26, TICK);
    }
    for (const l of (o.labels || [])) {
      const py = y.getPixelForValue(l.y);
      if (py < a.top || py > a.bottom) continue;
      g.font = "10px 'IBM Plex Mono', monospace";
      tag(g, a, l.text, a.right - g.measureText(l.text).width - 4, py - 6, INK, 10);
    }
    g.restore();
  },
};
function baseOpts(extra = {}) {
  return Object.assign({
    responsive: true, maintainAspectRatio: false, animation: STATIC ? false : { duration: 350 },
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: { backgroundColor: '#141820', borderColor: 'rgba(255,255,255,0.12)', borderWidth: 1, titleColor: TICK, bodyColor: INK,
                 titleFont: { family: 'IBM Plex Mono', size: 10 }, bodyFont: { family: 'IBM Plex Mono', size: 11 }, padding: 10, boxPadding: 4 },
    },
  }, extra);
}
function drawMarket(ctx) {
  const t = tenorOf(ctx.tenor), s = ctx.ngb[t.ngb], sp = ctx.spreads[t.k], lock = ctx.rates[t.k].rate;
  const el = document.getElementById('marketChart');
  if (charts.market) { charts.market.destroy(); charts.market = null; }
  if (!el) return;
  if (!s || !sp) { el.parentElement.innerHTML = '<div class="error-box">Statsrentene eller Finansportalen-dataene mangler — kan ikke tegne sammenligningen.</div>'; return; }
  const start = addDays(ctx.cyc.src, -75), end = addDays(s.last, LAG_DAYS);
  const days = [];
  for (let d = new Date(start); d <= end; d = addDays(d, 1)) if (d.getDay() % 6 !== 0) days.push(new Date(d));
  const idxOf = d0 => { const i = days.findIndex(d => d >= d0); return i < 0 ? days.length - 1 : i; };
  const yv = days.map(d => d <= s.last ? s.at(d) : null);
  const model = days.map(d => { const v = s.at(addDays(d, -LAG_DAYS)); return v == null ? null : v + sp.mean; });
  const fp = days.map(d => { const r = ctx.rd.byIso.get(iso(d)); return d <= TODAY && r && r[t.fp] != null ? r[t.fp] : null; });
  const vlines = [];
  if (ctx.nb) for (const c of ctx.nb.changes) if (c.eff >= start && c.eff <= end) vlines.push({ at: idxOf(addDays(c.eff, -1)), label: `NB ${bp((c.to - c.from) * 100)}`, color: 'rgba(255,255,255,0.35)' });
  vlines.push({ at: idxOf(s.last), label: `siste statsrente ${fmtDay(s.last)}`, color: 'rgba(255,255,255,0.18)', dash: [2, 3], row: 1 });
  const srcEnd = new Date(ctx.cyc.src.getFullYear(), ctx.cyc.src.getMonth() + 1, 0);
  charts.market = new Chart(el.getContext('2d'), {
    type: 'line',
    data: {
      labels: days.map(d => fmtDay(d)),
      datasets: [
        { label: `Statsrente ${t.label}`, data: yv, borderColor: NEUTRAL, borderWidth: 2, pointRadius: 0, pointHoverRadius: 3, tension: 0.15, spanGaps: true },
        { label: 'Modell: statsrente −14 d + normalt påslag', data: model, borderColor: t.color, borderWidth: 2, borderDash: [5, 4], pointRadius: 0, pointHoverRadius: 3, tension: 0.15, spanGaps: true },
        { label: 'Bankenes fastrente (Finansportalen topp-5)', data: fp, borderColor: t.color, backgroundColor: t.color, showLine: false, pointRadius: 5, pointHoverRadius: 7, pointBorderColor: SURFACE, pointBorderWidth: 2, pointHitRadius: 12 },
        ...(lock != null ? [{ label: `Låsbar i ${MONTHS[ctx.cyc.winOpen.getMonth()]}-vinduet`, data: days.map(() => lock), borderColor: INK, borderWidth: 1.5, borderDash: [2, 3], pointRadius: 0, pointHoverRadius: 0 }] : []),
      ],
    },
    options: baseOpts({
      scales: {
        x: { grid: { color: GRID }, border: { color: GRID }, ticks: { color: TICK, font: { size: 9, family: 'IBM Plex Mono' }, maxTicksLimit: 9, maxRotation: 0 } },
        y: { grid: { color: GRID }, border: { color: GRID }, ticks: { color: TICK, font: { size: 9, family: 'IBM Plex Mono' }, callback: v => nf(v, 2) + ' %' } },
      },
      plugins: Object.assign(baseOpts().plugins, {
        tooltip: Object.assign({}, baseOpts().plugins.tooltip, { callbacks: { label: c => c.parsed.y == null ? null : ` ${c.dataset.label}: ${pct(c.parsed.y)}` }, filter: c => c.parsed.y != null }),
        annotate: { bands: [{ from: idxOf(ctx.cyc.src), to: idxOf(srcEnd), label: `observasjon ${MON[ctx.cyc.src.getMonth()]} → ${MON[ctx.cyc.winOpen.getMonth()]}-satsen` }], vlines,
                    labels: lock != null ? [{ y: lock, text: `låsbar ${pct(lock)}` }] : [] },
      }),
    }),
    plugins: [annotate],
  });
  document.getElementById('marketLegend').innerHTML = [
    `<span><span class="sw line" style="background:${NEUTRAL}"></span>Statsrente ${t.label} (Norges Bank)</span>`,
    `<span><span class="sw dot" style="background:${t.color}"></span>Bankenes fastrente ${t.label} (Finansportalen topp-5, onsdager)</span>`,
    `<span><span class="sw dash" style="border-color:${t.color}"></span>Modell: statsrente −14 dager + normalt påslag (${pp(sp.mean)})</span>`,
    lock != null ? `<span><span class="sw dash" style="border-color:${INK}"></span>Låsbar sats ${pct(lock)}</span>` : '',
  ].join('');
}
function drawCalibration(ctx) {
  const t = tenorOf(ctx.tenor), f = ctx.cal[t.k], cur = ctx.sig[t.k];
  const el = document.getElementById('calChart');
  if (charts.cal) { charts.cal.destroy(); charts.cal = null; }
  const statsEl = document.getElementById('calStats'), tblEl = document.getElementById('calTable');
  if (!el) return;
  if (!f) { el.parentElement.innerHTML = '<div class="error-box">Ikke nok historikk til å kalibrere.</div>'; statsEl.innerHTML = ''; tblEl.innerHTML = ''; return; }
  const xs = f.rows.map(r => r.signal), lo = Math.floor((Math.min(...xs, cur ? cur.bp : 0) - 5) / 20) * 20, hi = Math.ceil((Math.max(...xs, cur ? cur.bp : 0) + 5) / 20) * 20;
  const hits = f.rows.filter(r => r.hit).length;
  const strong = f.rows.filter(r => cur && cur.bp >= 0 ? r.signal >= 15 : r.signal <= -15);
  statsEl.innerHTML = [
    ['Sykluser', `${f.rows.length}`],
    ['Gevinst, alle', `${hits} av ${f.rows.length}`],
    [cur && cur.bp >= 0 ? 'Gevinst, signal ≥ +15 bp' : 'Gevinst, signal ≤ −15 bp', `${strong.filter(r => r.hit).length} av ${strong.length}`],
    ['Korrelasjon', nf(f.corr, 2)],
    ['Helning', `${nf(f.beta, 2)} bp per bp`],
    ['Typisk avvik', `± ${nf(f.s, 0)} bp`],
    ['Signal nå', cur ? bp(cur.bp) : '—'],
  ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  const vlines = cur ? [{ at: cur.bp, label: `nå ${bp(cur.bp)} → forventet ${bp(f.beta * cur.bp)}`, color: INK, dash: [3, 3] }] : [];
  charts.cal = new Chart(el.getContext('2d'), {
    type: 'scatter',
    data: { datasets: [
      { label: 'Sykluser', data: f.rows.map(r => ({ x: r.signal, y: r.outcome, r })), backgroundColor: t.color, borderColor: SURFACE, borderWidth: 2, pointRadius: 5, pointHoverRadius: 7, pointHitRadius: 12 },
      { type: 'line', label: 'Tilpasning', data: [{ x: lo, y: f.beta * lo }, { x: hi, y: f.beta * hi }], borderColor: NEUTRAL, borderWidth: 1.5, pointRadius: 0, pointHoverRadius: 0 },
    ] },
    options: baseOpts({
      interaction: { mode: 'nearest', intersect: false },
      scales: {
        x: { type: 'linear', min: lo, max: hi, grid: { color: c => c.tick.value === 0 ? 'rgba(255,255,255,0.18)' : GRID }, border: { color: GRID },
             title: { display: true, text: 'Signal ved binding (bp)', color: TICK, font: { size: 9, family: 'IBM Plex Mono' } },
             ticks: { color: TICK, font: { size: 9, family: 'IBM Plex Mono' }, callback: v => bp(v) } },
        y: { grid: { color: c => c.tick.value === 0 ? 'rgba(255,255,255,0.18)' : GRID }, border: { color: GRID },
             title: { display: true, text: 'Neste sats − låst sats (bp)', color: TICK, font: { size: 9, family: 'IBM Plex Mono' } },
             ticks: { color: TICK, font: { size: 9, family: 'IBM Plex Mono' }, callback: v => bp(v) } },
      },
      plugins: Object.assign(baseOpts().plugins, {
        tooltip: Object.assign({}, baseOpts().plugins.tooltip, {
          filter: c => c.datasetIndex === 0,
          callbacks: { title: () => '', label: c => { const r = c.raw.r; return ` Bind ${fmtMonY(r.lockOpen)} → ${fmtMonY(r.breakOpen)}: signal ${bp(r.signal)}, utfall ${bp(r.outcome)} (${r.hit ? 'gevinst' : 'ikke gevinst'})`; } },
        }),
        annotate: { vlines },
      }),
    }),
    plugins: [annotate],
  });
  document.getElementById('calLegend').innerHTML = `<span><span class="sw dot" style="background:${t.color}"></span>Syklus (${t.label})</span><span><span class="sw line" style="background:${NEUTRAL}"></span>Tilpasning</span><span><span class="sw dash" style="border-color:${INK}"></span>Signalet nå</span>`;
  const showAll = ctx.calAll;
  const rows = f.rows.slice().reverse();
  tblEl.innerHTML = `<table class="wed-table"><thead><tr><th>Bind</th><th>Låst</th><th>Neste</th><th>Signal</th><th>Utfall</th><th>Resultat</th></tr></thead><tbody>
    ${(showAll ? rows : rows.slice(0, 9)).map(r => `<tr><td class="ink">${fmtMonY(r.lockOpen)}</td><td>${pct(r.lock)}</td><td>${pct(r.next)}</td><td>${bp(r.signal)}</td><td class="${r.outcome > 0 ? 'pos' : 'neg'}">${bp(r.outcome, 1)}</td><td><span class="badge ${r.hit ? 'yes' : 'miss'}">${r.hit ? 'gevinst' : 'ikke'}</span></td></tr>`).join('')}
    </tbody></table>${rows.length > 9 ? `<button class="more-btn" id="calMore">${showAll ? 'Vis færre' : `Vis alle ${rows.length}`}</button>` : ''}`;
  const more = document.getElementById('calMore');
  if (more) more.onclick = () => { ctx.calAll = !ctx.calAll; drawCalibration(ctx); };
}

// ── WIRING ──────────────────────────────────────────────────────────────────
function render(ctx) {
  const { cyc, rd } = ctx;
  const srcWeds = wednesdays(cyc.src), obsWeds = wednesdays(cyc.eff);
  document.getElementById('app').innerHTML = `
    <div class="topbar fade-in">
      <a href="/" class="logo-wrap" style="text-decoration:none"><div class="logo">Slensvik<span class="logo-dot">.</span>com</div><div class="logo-sub">Galton Algorithm · Oslo Børs</div></a>
      <div class="topbar-right"><div data-intel-nav></div></div>
    </div>
    <div class="hero fade-in">
      <div class="hero-eyebrow">Lånekassen · rentestrategi</div>
      <h1 class="hero-title">Fastrente<br><span>Strategi</span></h1>
      <p class="hero-desc">Du kan binde renten i Lånekassen i et vindu (10.–17.) annenhver måned. Satsen er snittet av bankenes fastrenter observert hver onsdag i måneden før — den er altså allerede historie når vinduet åpner.
      Har markedet steget siden, binder du under markedsprisen, og i neste vindu kan du bryte og få differansen trukket fra gjelden (rentegevinst). Siden regner ut om det lønner seg i vinduet som kommer.</p>
    </div>
    <div class="main fade-in">
      ${windowBanner(cyc)}
      ${ctx.errors.length ? `<div class="error-box">Noen datakilder svarte ikke: ${esc(ctx.errors.join(' · '))}. Seksjonene som trenger dem er skjult eller merket.</div>` : ''}
      ${decisionPanel(ctx)}
      ${marketCard(ctx)}
      ${calibrationCard(ctx)}
      ${nbCard(ctx)}
      ${trackerCard(ctx)}
      <div class="two-col">
        ${wedTable(`${MONTHS[cyc.src.getMonth()]} ${cyc.src.getFullYear()} · satte ${MONTHS[cyc.winOpen.getMonth()]}-satsen`, 'historisk', srcWeds, rd)}
        ${wedTable(`${MONTHS[cyc.eff.getMonth()]} ${cyc.eff.getFullYear()} · setter ${MONTHS[cyc.nextOpen.getMonth()]}-satsen`, 'pågår', obsWeds, rd)}
      </div>
      ${healthStrip(ctx)}
    </div>
    <div class="footer">
      <div class="footer-text">Slensvik.com · Fastrente Strategi<br>Kun til informasjonsformål. Ikke finansiell rådgivning.</div>
      <div class="footer-text" style="text-align:right">Data: Lånekassen (offisielle satser) · Finansportalen topp-5 (onsdager)<br>Norges Bank (styringsrente, statsrenter) · beregning av rentegevinst etter Lånekassens beskrivelse</div>
    </div>`;
  if (window.INTEL) INTEL.injectNav();
  wire(ctx);
  drawMarket(ctx);
  drawCalibration(ctx);
}
function wire(ctx) {
  const reDecide = () => {
    ctx.dec = decide(ctx, ctx.inputs);
    const g = document.getElementById('tenorGrid'); if (g) g.innerHTML = tenorCards(ctx);
    const a = document.getElementById('alreadyBox'); if (a) a.innerHTML = alreadyBox(ctx);
  };
  const bal = document.getElementById('inBalance'), yrs = document.getElementById('inYears');
  if (bal) bal.addEventListener('input', () => { const v = +bal.value; if (v >= 1000) { ctx.inputs.balance = v; store.set('balance', v); reDecide(); } });
  if (yrs) yrs.addEventListener('input', () => { const v = +yrs.value; if (v >= 3 && v <= 30) { ctx.inputs.years = v; store.set('years', v); reDecide(); } });
  for (const id of ['segMarket', 'segCal']) {
    const seg = document.getElementById(id);
    if (!seg) continue;
    seg.addEventListener('click', e => {
      const btn = e.target.closest('button[data-k]'); if (!btn) return;
      ctx.tenor = +btn.dataset.k; store.set('tenor', ctx.tenor);
      for (const sid of ['segMarket', 'segCal']) document.querySelectorAll(`#${sid} button`).forEach(b => { const on = +b.dataset.k === ctx.tenor; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
      drawMarket(ctx); drawCalibration(ctx);
    });
  }
}

(async () => {
  try {
    const [sheet, lkRes, hist] = await loadAll();
    const errors = [];
    const rd = sheet.status === 'fulfilled' ? parseReadings(sheet.value) : (errors.push('Finansportalen-regnearket (' + sheet.reason.message + ')'), { byIso: new Map(), readings: [] });
    const lk = lkRes.status === 'fulfilled' && lkRes.value.length ? lkModel(lkRes.value) : (errors.push('Lånekassen-satser' + (lkRes.reason ? ' (' + lkRes.reason.message + ')' : '')), null);
    const ngb = {}; let pol = null;
    if (hist.status === 'fulfilled') {
      for (const s of hist.value) { const ser = makeSeries(s.dates, s.vals); if (s.series_id === 'pol.no') pol = ser; else ngb[s.series_id] = ser; }
    } else errors.push('Norges Bank-data (' + hist.reason.message + ')');
    const cyc = cycleFor(TODAY);
    const spreads = {}, sig = {};
    for (const t of TENORS) { spreads[t.k] = spreadStats(rd.readings, ngb[t.ngb], t.fp); sig[t.k] = signalFor(cyc, ngb[t.ngb]); }
    const inputs = { balance: +store.get('balance', DEFAULTS.balance) || DEFAULTS.balance, years: +store.get('years', DEFAULTS.years) || DEFAULTS.years };
    const ctx = { cyc, rd, lk, ngb, pol, spreads, sig, errors, inputs, tenor: tenorOf(store.get('tenor', DEFAULTS.tenor)).k, calAll: false };
    ctx.rates = windowRates(cyc, lk, rd, ngb, spreads);
    ctx.cal = calibrate(lk, ngb, inputs.years);
    ctx.nb = nbModel(pol, cyc);
    ctx.dec = decide(ctx, inputs);
    render(ctx);
    window.__fastrente = ctx;   // for debugging in the console
  } catch (err) {
    document.getElementById('app').innerHTML = `<div class="loading"><div class="error-box" style="max-width:560px"><div style="color:var(--red);font-size:12px;margin-bottom:8px">Feil ved lasting av data</div>${esc(err.message)}<br><br>Sjekk konsollen for detaljer.</div></div>`;
    console.error(err);
  }
})();
</script>
